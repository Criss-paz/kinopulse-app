<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KinoPulse</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #090A0F; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { color: rgba(255,255,255,.6); margin: 0 0 24px; }
  button { background: #00F0FF; color: #090A0F; border: 0; border-radius: 12px; padding: 14px 28px; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
  button:focus { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
  <div>
    <h1>Sin conexión a internet</h1>
    <p>KinoPulse necesita internet para mostrar el catálogo.</p>
    <button id="retry" autofocus>Reintentar</button>
  </div>
  <script>
    var retry = function () { location.href = 'https://kinopulse.vercel.app/'; };
    document.getElementById('retry').onclick = retry;
    window.addEventListener('online', retry);
  </script>
</body>
</html>
